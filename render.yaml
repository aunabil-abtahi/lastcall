services:
  - type: web
    name: lastcall
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: lastcall
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: APP_URL
        sync: false
      - key: SSLCOMMERZ_MODE
        value: sandbox
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
